<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A panel with one lit port: the same idea the whole site is built on.
       Static, in Hack Club red, for the pages that have no program behind them
       (/embed, 404). Inside a program, the tab wears that program's logo — see
       generateMetadata in app/[program]/layout.tsx. -->
  <rect width="32" height="32" rx="5" fill="#17110f" />
  <rect x="6" y="9" width="20" height="2.5" rx="1.25" fill="#ec3750" opacity="0.9" />
  <rect x="6" y="15" width="14" height="2.5" rx="1.25" fill="#f4f1ea" opacity="0.35" />
  <rect x="6" y="21" width="9" height="2.5" rx="1.25" fill="#f4f1ea" opacity="0.35" />
  <circle cx="24" cy="22.25" r="2.75" fill="#ec3750" />
</svg>
